name: Build and deploy
on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-and-publish:
    name: Build and push image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and push image and SBOM to OCI registry
        uses: nais/docker-build-push@v1.0.0
        id: docker-build-push
        with:
          team: novari-demo
          tenant: novari

  deploy-to-test:
    name: Deploy to test
    runs-on: ubuntu-latest
    needs: build-and-publish
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: nais/deploy/actions/deploy@30ed20fc7021e78d03ca9544b0c561d37f826296 # v3
        env:
          CLUSTER: test
          RESOURCE: .nais/app.yaml
          VAR: image=${{ needs.build-and-publish.outputs.image }}
