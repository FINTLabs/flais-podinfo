name: Build and deploy
on:
  push:
    branches:
      - master
jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and push image and SBOM to OCI registry
        uses: nais/docker-build-push@6394144a53cad0332745f24a8302f5efaf81719a # v.1.0.0
        id: docker-build-push
        with:
          team: flais

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nais/setup@fb8692f65df9c904e2cdac5d395630ac876abdcf # v1.0.3
        with:
          team: flais
      - name: Deploy to Nais
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          nais apply .nais/app.yaml \
            --environment test \
            --set spec.image="${IMAGE}" \
            --wait
